<!doctype html>
<html lang="ko" data-theme="system">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>Prompt Optimizer</title>
    <link rel="stylesheet" href="popup.css">
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="app-header">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 7h8M5 12h5M5 17h8M16 7l3 5-3 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="brand-copy"><h1>Prompt Optimizer <span id="provider-badge" class="local-badge">GEMINI API</span></h1><p>생각은 그대로, 요청은 더 명확하게.</p></div>
      <label class="visually-hidden" for="theme">테마</label>
      <select id="theme" class="theme-select" title="화면 테마" disabled>
        <option value="system">◐ 자동</option><option value="light">☀ 밝게</option><option value="dark">☾ 어둡게</option>
      </select>
    </header>

    <main id="workspace" aria-busy="true">
      <section class="engine-section" aria-label="최적화 엔진">
        <div class="section-heading"><label>최적화 엔진</label><div class="section-links"><a id="help-link" class="text-button" href="../help/help.html" target="_blank" rel="noopener">사용 설명서 ↗</a><button id="api-settings" class="text-button" type="button">Gemini API 설정 ↗</button></div></div>
        <div class="fixed-engine">Gemini API · 의미 분석·맞춤 재작성</div>
        <p id="engine-hint" class="engine-hint">선택한 Gemini 모델로 원문을 전송해 재작성합니다.</p>
        <label class="toolbar-setting" for="toolbar-enabled"><span><b>페이지 미니 도구</b><small>AI 입력창 옆의 Optimize·Undo 창</small></span><input id="toolbar-enabled" type="checkbox" checked disabled><span class="toolbar-switch" aria-hidden="true"></span></label>
      </section>
      <div class="settings-row">
        <div class="field"><label for="target-model">대상 AI <span>Target AI</span></label>
          <select id="target-model" disabled><option value="chatgpt">ChatGPT</option><option value="claude">Claude</option><option value="gemini">Gemini</option><option value="perplexity">Perplexity</option></select>
        </div>
        <div class="field"><label for="response-language">응답 언어 <span>Language</span></label>
          <select id="response-language" disabled><option value="auto">Auto · 입력 언어</option><option value="ko">한국어</option><option value="en">English</option><option value="ja">日本語</option><option value="zh">中文</option></select>
        </div>
      </div>

      <fieldset id="mode-options" class="mode-fieldset" disabled>
        <legend>최적화 모드 <span>원하는 방향을 골라 주세요</span></legend>
        <div class="mode-grid">
          <label class="mode-card"><input type="radio" name="mode" value="default" checked><span class="mode-body"><span class="mode-title">Default</span><span class="mode-description">명확하고 균형 있게</span></span><span class="radio-indicator" aria-hidden="true"></span></label>
          <label class="mode-card"><input type="radio" name="mode" value="eco"><span class="mode-body"><span class="mode-title">ECO <span class="mode-tag">토큰 절약</span></span><span class="mode-description">핵심만 짧고 간결하게</span></span><span class="radio-indicator" aria-hidden="true"></span></label>
          <label class="mode-card"><input type="radio" name="mode" value="precision"><span class="mode-body"><span class="mode-title">Precision <span class="mode-tag">정확함</span></span><span class="mode-description">조건과 기준을 구체적으로</span></span><span class="radio-indicator" aria-hidden="true"></span></label>
          <label class="mode-card"><input type="radio" name="mode" value="natural"><span class="mode-body"><span class="mode-title">Natural</span><span class="mode-description">자연스러운 문체</span></span><span class="radio-indicator" aria-hidden="true"></span></label>
        </div>
      </fieldset>

      <section class="editor-section" aria-labelledby="source-label">
        <div class="section-heading"><label id="source-label" for="source">나의 요청</label><button id="import-page" class="text-button" type="button" title="현재 AI 페이지의 입력창 내용을 가져옵니다" disabled><svg aria-hidden="true" viewBox="0 0 16 16" fill="none"><path d="M8 2v8m-3-3 3 3 3-3M3 11v3h10v-3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>페이지에서 가져오기</button></div>
        <div class="textarea-wrap"><textarea id="source" rows="4" spellcheck="false" placeholder="예: 강화학습 로봇이 앞으로 가지 않고 제자리에서 버티는데, 왜 그런지 분석해 줘." aria-describedby="source-hint source-count" disabled></textarea><div class="editor-bottom"><span id="source-hint">평소처럼 편하게 적어 주세요</span><span id="source-count">0 / 12,000</span></div></div>
      </section>

      <button id="optimize" class="primary-button" type="button" disabled><svg class="optimize-icon" aria-hidden="true" viewBox="0 0 20 20" fill="none"><path d="m10 2 2.2 5.8L18 10l-5.8 2.2L10 18l-2.2-5.8L2 10l5.8-2.2L10 2Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg><span id="optimize-label">Optimize Prompt</span><kbd>Ctrl ↵</kbd></button>

      <section class="editor-section output-section" aria-labelledby="output-label">
        <div class="section-heading"><label id="output-label" for="output">최적화된 프롬프트</label><span id="result-detail" class="result-detail">결과 미리보기</span></div>
        <div class="textarea-wrap output-wrap"><textarea id="output" rows="5" spellcheck="false" readonly placeholder="최적화하면 여기에 표시됩니다.&#10;내용을 확인한 후 복사하거나 AI 입력창에 넣어 보세요." aria-describedby="output-count"></textarea><div class="editor-bottom"><span id="result-language">의도는 유지하고, 전달은 선명하게</span><span id="output-count">0자</span></div></div>
        <div class="action-row"><button id="copy" class="secondary-button" type="button" disabled><svg aria-hidden="true" viewBox="0 0 16 16" fill="none"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M10.5 3.5V3A1.5 1.5 0 0 0 9 1.5H3A1.5 1.5 0 0 0 1.5 3v6A1.5 1.5 0 0 0 3 10.5h.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Copy <span>복사</span></button><button id="replace" class="secondary-button replace-button" type="button" title="현재 AI 입력창의 내용만 교체합니다. 메시지는 전송하지 않습니다." disabled>Replace <span>입력창에 넣기</span></button><button id="reset" class="reset-button" type="button" title="팝업의 요청과 결과 비우기" disabled>Reset</button></div>
      </section>

      <div class="page-info"><span id="page-status" class="page-status">AI 페이지 연결 확인 중…</span><div class="page-actions"><button id="reconnect-page" class="text-button" type="button" title="현재 페이지에서 AI 입력창을 처음부터 다시 찾습니다" disabled>↻ 다시 찾기</button><button id="reload-page" class="text-button reload-page" type="button" title="현재 AI 페이지를 새로고침합니다. 전송하지 않은 페이지 입력 내용은 사라질 수 있습니다." hidden disabled>페이지 새로고침</button><button id="undo" class="text-button" type="button" title="페이지 입력창을 최적화 전 내용으로 되돌립니다" hidden disabled>↶ 원문 복구</button></div></div>
      <div id="feedback" class="feedback" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    </main>

    <footer><svg aria-hidden="true" viewBox="0 0 14 14" fill="none"><path d="M7 1.5 11.5 3v3.5c0 2.7-2 4.6-4.5 6-2.5-1.4-4.5-3.3-4.5-6V3L7 1.5Z" stroke="currentColor" stroke-width="1.2"/><path d="m4.8 6.8 1.5 1.5 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="processing-note">Gemini API로 전송 · 자동 유료 전환 없음</span><span class="footer-divider">·</span><span title="요청과 결과는 이 브라우저 세션 동안 확장 프로그램 메모리에만 보관됩니다. 브라우저를 종료하면 지워집니다. Reset으로 지금 지울 수 있습니다.">초안은 세션 동안만 보관</span></footer>
  </body>
</html>
